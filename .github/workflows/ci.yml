name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install NASM (Windows, aws-lc-rs)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Binary rilis untuk kedua platform, dibangun dan dikemas oleh CI.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            archive: tar.gz
          - os: windows-latest
            target: x86_64-windows
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test binary (Linux)
        if: runner.os == 'Linux'
        run: |
          ./target/release/anicli --version
          ./target/release/sourcecheck --help > /dev/null
          ./target/release/anicli config path

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/release/anicli.exe --version
          ./target/release/sourcecheck.exe --help | Out-Null
          ./target/release/anicli.exe config path

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp target/release/anicli "dist/anicli-${{ matrix.target }}"
          cp target/release/sourcecheck "dist/sourcecheck-${{ matrix.target }}"
          tar -czf "anicli-rs-v$VERSION-${{ matrix.target }}.tar.gz" -C target/release anicli sourcecheck
          ( cd dist && sha256sum anicli-* sourcecheck-* > "SHA256SUMS-${{ matrix.target }}.txt" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/anicli.exe "dist/anicli-${{ matrix.target }}.exe"
          Copy-Item target/release/sourcecheck.exe "dist/sourcecheck-${{ matrix.target }}.exe"
          Compress-Archive -Path "dist/anicli-${{ matrix.target }}.exe", "dist/sourcecheck-${{ matrix.target }}.exe" `
            -DestinationPath "anicli-rs-v$version-${{ matrix.target }}.zip"
          $lines = Get-ChildItem dist -Filter *.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" }
          Set-Content -Path "dist/SHA256SUMS-${{ matrix.target }}.txt" -Value $lines -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anicli-rs-${{ matrix.target }}
          path: |
            dist/*
            anicli-rs-v*-${{ matrix.target }}.tar.gz
            anicli-rs-v*-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30

  # Binary Android/Termux (aarch64, Bionic) via Android NDK — pengguna Termux
  # tinggal unduh, tidak perlu build manual. ring tidak butuh cmake/NASM.
  build-android:
    name: build (aarch64-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (target Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Ensure Android target
        run: |
          set -euo pipefail
          rustup show
          rustup target add aarch64-linux-android
          rustup target list --installed | grep aarch64-linux-android
          which cargo; cargo --version; rustc --version

      - name: Release build (arm64-v8a, API 24)
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a --platform 24 build --release --locked

      - name: Verify ELF (aarch64 + linker64)
        run: |
          set -euo pipefail
          BIN=target/aarch64-linux-android/release/anicli
          file "$BIN"
          readelf -h "$BIN" | grep -q 'AArch64' && echo "machine: AArch64 OK"
          readelf -l "$BIN" | grep -qi 'interpreter.*linker64' && echo "interpreter: linker64 OK"

      - name: Package
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          mkdir -p dist
          cp target/aarch64-linux-android/release/anicli "dist/anicli-aarch64-android"
          cp target/aarch64-linux-android/release/sourcecheck "dist/sourcecheck-aarch64-android"
          tar -czf "anicli-rs-v$VERSION-aarch64-android.tar.gz" -C target/aarch64-linux-android/release anicli sourcecheck
          ( cd dist && sha256sum anicli-* sourcecheck-* > SHA256SUMS-aarch64-android.txt )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anicli-rs-aarch64-android
          path: |
            dist/*
            anicli-rs-v*-aarch64-android.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Saat tag v* di-push: lampirkan artefak CI (Linux + Windows) ke GitHub Release.
  release:
    name: attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print
          find artifacts -type f \( \
            -name 'anicli-rs-v*.tar.gz' -o \
            -name 'anicli-rs-v*.zip' -o \
            -name 'anicli-aarch64-android' -o \
            -name 'sourcecheck-aarch64-android' -o \
            -name 'anicli-x86_64-*' -o \
            -name 'sourcecheck-x86_64-*' -o \
            -name 'SHA256SUMS-*.txt' \) -exec cp {} release/ \;
          ls -lh release

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          # Tag ber-sufiks (mis. v0.9.0-rc1) = pre-release untuk dites lokal.
          prerelease: ${{ contains(github.ref_name, '-') }}

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Toolchain 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --all-targets
