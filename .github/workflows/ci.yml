name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install NASM (Windows, aws-lc-rs)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release

  # Binary Windows asli (MSVC) — artefak diunggah untuk diunduh manual/rilis.
  build-windows:
    name: build (windows-latest msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM (aws-lc-rs)
        run: choco install nasm -y --no-progress

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/anicli.exe dist/anicli-x86_64-windows.exe
          Copy-Item target/release/sourcecheck.exe dist/sourcecheck-x86_64-windows.exe
          Compress-Archive -Path dist/anicli-x86_64-windows.exe, dist/sourcecheck-x86_64-windows.exe -DestinationPath anicli-rs-${{ github.ref_name }}-x86_64-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anicli-rs-windows-x86_64
          path: anicli-rs-*-x86_64-windows.zip
          if-no-files-found: error

  # Saat tag v* di-push: bangun Linux + Windows lalu lampirkan ke GitHub Release.
  release-assets:
    name: release assets (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-windows]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/anicli dist/anicli-${{ matrix.target }}
          cp target/release/sourcecheck dist/sourcecheck-${{ matrix.target }}
          tar -czf anicli-rs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/release anicli sourcecheck

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/anicli.exe dist/anicli-${{ matrix.target }}.exe
          Copy-Item target/release/sourcecheck.exe dist/sourcecheck-${{ matrix.target }}.exe
          Compress-Archive -Path dist/anicli-${{ matrix.target }}.exe, dist/sourcecheck-${{ matrix.target }}.exe -DestinationPath anicli-rs-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            anicli-rs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            anicli-rs-${{ github.ref_name }}-${{ matrix.target }}.zip
            dist/anicli-${{ matrix.target }}
            dist/anicli-${{ matrix.target }}.exe
            dist/sourcecheck-${{ matrix.target }}
            dist/sourcecheck-${{ matrix.target }}.exe
          fail_on_unmatched_files: false

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Toolchain 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --all-targets
